worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    resolver 127.0.0.11 valid=30s;

    # ─────────────────────────────────────────────────────────
    # TROQUE "TROQUE-PELO-APP-NAME-DA-API" pelo App Name que o
    # Dokploy mostrar na página da Application da API (algo tipo
    # projeto-nomedoapp-hash). Depois de trocar, precisa rebuildar
    # este serviço (Redeploy) pra pegar o valor novo.
    # ─────────────────────────────────────────────────────────
    upstream api_backend {
        server TROQUE-PELO-APP-NAME-DA-API:8000;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index login.html;

        # Rotas que são da API, tudo o mais é arquivo estático
        location ~ ^/(admin|auth|dashboard|movimentacoes|produtos|webhook|whatsapp)(/|$) {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /login.html;
        }
    }
}
